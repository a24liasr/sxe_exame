#Odoo Servers
upstream odoo1 {
        server ####:8069 weight=1 fail_timeout=0;
}

upstream odoo1chat {
        server ####:8072 weight=1 fail_timeout=0;
}

# Directivas Comunes a todos los server
proxy_read_timeout 720s;
proxy_connect_timeout 720s;
proxy_send_timeout 720s;

# Add Headers for odoo proxy mode
proxy_set_header X-Forwarded-Host \$host;
proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto \$scheme;
proxy_set_header X-Real-IP \$remote_addr;

# Sección de bloques server
server {
        listen 80;        
        server_name ####;
	keepalive_timeout 60;

        # log
        access_log /var/log/nginx/in1.access.log;
        error_log /var/log/nginx/in1.error.log;

        # Redirect requests to odoo backend server
        location / {
                proxy_redirect off;
                proxy_pass http://####;
        }

        location /longpolling {
                proxy_pass http://odoo1chat;
        }

        # common gzip
        gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript;
        gzip on;
}
